<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>No Mercy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at center, rgba(110, 20, 170, 0.16), transparent 38%),
        #030304;
      color: white;
    }

    .page {
      width: 100%;
      height: 100vh;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* Hintergrund-Glow */

    .background-glow {
      position: absolute;

      width: 900px;
      height: 900px;

      border-radius: 50%;

      background: rgba(115, 20, 180, 0.18);

      filter: blur(220px);

      pointer-events: none;

      animation: backgroundPulse 5s ease-in-out infinite alternate;
    }

    @keyframes backgroundPulse {
      from {
        opacity: 0.35;
        transform: scale(0.9);
      }

      to {
        opacity: 0.65;
        transform: scale(1.08);
      }
    }

    /* Logo */

    .logo {
      position: absolute;

      top: 40px;
      left: 55px;

      font-size: 22px;

      font-weight: 900;

      letter-spacing: 8px;

      z-index: 10;
    }

    .logo span {
      color: #b94dff;

      text-shadow:
        0 0 12px rgba(185, 77, 255, 0.7),
        0 0 25px rgba(185, 77, 255, 0.3);
    }

    /* EST */

    .established {
      position: absolute;

      top: 45px;
      right: 55px;

      color: #777;

      font-size: 11px;

      letter-spacing: 7px;

      z-index: 10;
    }

    /* Hauptbereich */

    .hero {
      position: relative;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      z-index: 5;
    }

    /* Amethyst */

    .amethyst-wrapper {
      position: relative;

      width: min(420px, 65vw);

      cursor: pointer;

      animation: float 3.8s ease-in-out infinite;

      transition: 0.35s ease;
    }

    .amethyst-wrapper:hover {
      filter:
        drop-shadow(0 0 20px rgba(189, 80, 255, 0.5))
        drop-shadow(0 0 50px rgba(135, 30, 210, 0.3));
    }

    .amethyst {
      width: 100%;

      display: block;

      user-select: none;

      filter:
        drop-shadow(0 0 15px rgba(190, 80, 255, 0.45))
        drop-shadow(0 0 55px rgba(125, 25, 200, 0.3));

      transition: transform 0.35s ease;
    }

    .amethyst-wrapper:hover .amethyst {
      transform: scale(1.025);
    }

    @keyframes float {
      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-15px);
      }
    }

    /* Licht unter dem Stein */

    .ground-light {
      width: 280px;
      height: 12px;

      margin-top: -18px;

      border-radius: 50%;

      background: #c14fff;

      filter: blur(12px);

      opacity: 0.55;

      box-shadow:
        0 0 40px rgba(193, 79, 255, 0.65),
        0 0 80px rgba(125, 20, 190, 0.35);
    }

    /* Spiegelung */

    .reflection {
      width: 170px;
      height: 90px;

      margin-top: 6px;

      opacity: 0.16;

      background: linear-gradient(
        to bottom,
        rgba(195, 90, 255, 0.45),
        transparent
      );

      clip-path: polygon(
        50% 0,
        100% 100%,
        0 100%
      );

      filter: blur(5px);
    }

    /* Text unter Amethyst */

    .click-text {
      margin-top: 18px;

      font-size: 12px;

      letter-spacing: 8px;

      color: #9b94a0;

      text-transform: uppercase;

      animation: textPulse 2s ease-in-out infinite;
    }

    @keyframes textPulse {
      0%,
      100% {
        opacity: 0.5;
      }

      50% {
        opacity: 1;
      }
    }

    /* Kleine Partikel */

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #bd5cff;

      box-shadow: 0 0 8px #bd5cff;

      opacity: 0.5;

      animation: particleFloat linear infinite;
    }

    @keyframes particleFloat {
      from {
        transform: translateY(30px);
        opacity: 0;
      }

      20% {
        opacity: 0.6;
      }

      to {
        transform: translateY(-130px);
        opacity: 0;
      }
    }

    /* Responsive */

    @media (max-width: 700px) {
      .logo {
        top: 25px;
        left: 25px;

        font-size: 17px;
        letter-spacing: 5px;
      }

      .established {
        top: 30px;
        right: 25px;

        font-size: 8px;
        letter-spacing: 4px;
      }

      .amethyst-wrapper {
        width: 75vw;
      }

      .click-text {
        font-size: 9px;
        letter-spacing: 5px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="background-glow"></div>

    <div class="logo">
      NO <span>MERCY</span>
    </div>

    <div class="established">
      EST. 2026
    </div>

    <div class="hero">

      <div class="amethyst-wrapper" id="amethystButton">

        <img
          src="amethyst.png"
          alt="No Mercy Amethyst"
          class="amethyst"
        >

      </div>

      <div class="ground-light"></div>

      <div class="reflection"></div>

      <div class="click-text">
        Click the Amethyst
      </div>

    </div>

  </div>

  <script>

    /* Partikel erzeugen */

    for (let i = 0; i < 30; i++) {

      const particle = document.createElement("div");

      particle.className = "particle";

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.top =
        Math.random() * 100 + "%";

      particle.style.animationDuration =
        4 + Math.random() * 6 + "s";

      particle.style.animationDelay =
        Math.random() * 5 + "s";

      document.querySelector(".page").appendChild(particle);

    }


    /* Klick auf den Amethysten */

    document
      .getElementById("amethystButton")
      .addEventListener("click", function () {

        console.log("Amethyst clicked!");

      });

  </script>

</body>
</html>
