<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>No Mercy</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 48%,
            rgba(0, 110, 255, 0.18),
            transparent 42%
        ),
        #020203;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   PAGE
========================================================= */

.page {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {
    position: absolute;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(0, 120, 255, .18);

    filter:
        blur(220px);

    pointer-events: none;

    animation:
        backgroundPulse
        6s
        ease-in-out
        infinite
        alternate;
}

@keyframes backgroundPulse {

    from {
        opacity: .35;

        transform:
            translate(-50%, -50%)
            scale(.92);
    }

    to {
        opacity: .7;

        transform:
            translate(-50%, -50%)
            scale(1.08);
    }

}


/* =========================================================
   LOGO
========================================================= */

.logo {
    position: absolute;

    top: 38px;
    left: 52px;

    z-index: 200;

    font-size: 21px;
    font-weight: 900;

    letter-spacing: 8px;
}

.logo span {
    color: #1597ff;

    text-shadow:
        0 0 10px rgba(21, 151, 255, .8),
        0 0 30px rgba(21, 151, 255, .35);
}

.established {
    position: absolute;

    top: 44px;
    right: 52px;

    z-index: 200;

    color: #69788d;

    font-size: 10px;

    letter-spacing: 7px;
}


/* =========================================================
   CINEMATIC START
========================================================= */

.boot-screen {
    position: fixed;
    inset: 0;
    z-index: 2000;

    background: #000;

    opacity: 1;

    pointer-events: none;

    transition:
        opacity 1s ease;
}

.boot-screen.fade-out {
    opacity: 0;
}


/* =========================================================
   INTRO
========================================================= */

.intro {
    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%)
        scale(.82);

    display: flex;
    flex-direction: column;

    align-items: center;

    z-index: 50;

    opacity: 0;

    filter: blur(8px);
}

.intro.intro-visible {
    animation:
        introReveal
        1.15s
        cubic-bezier(.16,.9,.25,1)
        forwards;
}

@keyframes introReveal {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.82);

        filter:
            blur(8px);
    }

    60% {
        opacity: 1;

        filter:
            blur(0);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);

        filter:
            blur(0);
    }

}


/* =========================================================
   INTRO TITLE
========================================================= */

.intro-title {
    margin-bottom: 14px;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: 10px;

    color: #8ed6ff;

    text-transform: uppercase;

    opacity: 0;

    text-shadow:
        0 0 12px rgba(65, 180, 255, .65),
        0 0 30px rgba(0, 115, 255, .35);
}

.intro-title.visible {
    animation:
        introTextIn
        .8s
        ease
        forwards;
}

@keyframes introTextIn {

    from {
        opacity: 0;

        transform:
            translateY(8px);

        letter-spacing: 16px;
    }

    to {
        opacity: .95;

        transform:
            translateY(0);

        letter-spacing: 10px;
    }

}


/* =========================================================
   AMETHYST
========================================================= */

.amethyst-wrapper {
    position: relative;

    width:
        min(410px, 60vw);

    cursor: pointer;

    pointer-events: none;

    animation:
        crystalFloat
        4s
        ease-in-out
        infinite;

    transition:
        filter .35s ease;
}

.amethyst-wrapper.ready {
    pointer-events: auto;
}

.amethyst-wrapper.ready::after {
    content: "";

    position: absolute;

    inset: 8% 12%;

    border-radius: 50%;

    background:
        rgba(0, 145, 255, .12);

    filter:
        blur(42px);

    z-index: -1;

    animation:
        introCorePulse
        2.8s
        ease-in-out
        infinite
        alternate;
}

@keyframes introCorePulse {

    from {
        opacity: .25;
        transform: scale(.88);
    }

    to {
        opacity: .8;
        transform: scale(1.08);
    }

}

@keyframes crystalFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-17px)
            rotate(1deg);
    }

}

.amethyst {
    display: block;

    width: 100%;

    user-select: none;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 18px
            rgba(20, 145, 255, .55)
        )
        drop-shadow(
            0 0 65px
            rgba(0, 85, 220, .30)
        );

    transition:
        transform .35s ease,
        filter .35s ease,
        opacity .3s ease;
}

.amethyst-wrapper.ready:hover .amethyst {
    transform:
        scale(1.055)
        rotate(.5deg);

    filter:
        brightness(1.22)
        drop-shadow(
            0 0 34px
            rgba(95, 205, 255, .95)
        )
        drop-shadow(
            0 0 95px
            rgba(0, 105, 255, .55)
        );
}


/* =========================================================
   GROUND LIGHT
========================================================= */

.ground-light {
    width: 260px;
    height: 8px;

    margin-top: -12px;

    border-radius: 50%;

    background:
        #18a8ff;

    filter:
        blur(9px);

    opacity: .7;

    box-shadow:
        0 0 30px
        rgba(24, 168, 255, .82),

        0 0 70px
        rgba(0, 100, 230, .48);

    transition:
        opacity .4s ease;
}


/* =========================================================
   CLICK TEXT
========================================================= */

.click-text {
    margin-top: 38px;

    font-size: 11px;

    color: #8e9bad;

    letter-spacing: 8px;

    text-transform: uppercase;

    opacity: 0;
}

.click-text.ready {
    animation:
        clickTextReveal
        .6s
        ease
        forwards,

        clickPulse
        2s
        ease-in-out
        .6s
        infinite;
}

@keyframes clickTextReveal {

    from {
        opacity: 0;
        transform: translateY(8px);
    }

    to {
        opacity: .9;
        transform: translateY(0);
    }

}

@keyframes clickPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   CHARGE
========================================================= */

.amethyst-wrapper.charging {
    animation:
        charge
        .7s
        ease-in-out
        forwards;
}

@keyframes charge {

    0% {
        transform:
            scale(1);
    }

    30% {
        transform:
            scale(.96);
    }

    65% {
        transform:
            scale(1.06);

        filter:
            brightness(1.7)
            drop-shadow(
                0 0 55px
                rgba(125, 215, 255, 1)
            );
    }

    100% {
        transform:
            scale(1.12);

        filter:
            brightness(2.4)
            drop-shadow(
                0 0 110px
                rgba(170, 230, 255, 1)
            );
    }

}


/* =========================================================
   FLASH
========================================================= */

.flash {
    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    opacity: 0;

    background:
        radial-gradient(
            circle at center,

            #ffffff 0%,
            #c5ecff 12%,
            #36aaff 32%,
            rgba(0, 105, 235, .5) 50%,
            transparent 75%
        );
}

.flash.active {
    animation:
        flashBang
        .45s
        ease-out
        forwards;
}

@keyframes flashBang {

    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    45% {
        opacity: .7;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   SHOCKWAVE
========================================================= */

.shockwave {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 70px;
    height: 70px;

    transform:
        translate(-50%, -50%);

    border:
        3px solid
        #63c8ff;

    border-radius: 50%;

    opacity: 0;

    pointer-events: none;

    z-index: 90;
}

.shockwave.active {
    animation:
        shockwaveAnimation
        1s
        ease-out
        forwards;
}

@keyframes shockwaveAnimation {

    from {
        width: 70px;
        height: 70px;

        opacity: 1;

        box-shadow:
            0 0 50px
            #168fff;
    }

    to {
        width: 1100px;
        height: 1100px;

        opacity: 0;

        border-width: 1px;
    }

}


/* =========================================================
   SCREEN SHAKE
========================================================= */

body.screen-shake {
    animation:
        screenShake
        .38s
        linear;
}

@keyframes screenShake {

    0% {
        transform: translate(0, 0);
    }

    15% {
        transform: translate(-7px, 3px);
    }

    30% {
        transform: translate(6px, -4px);
    }

    45% {
        transform: translate(-4px, -2px);
    }

    60% {
        transform: translate(4px, 3px);
    }

    75% {
        transform: translate(-2px, 1px);
    }

    100% {
        transform: translate(0, 0);
    }

}


/* =========================================================
   DEBRIS
========================================================= */

.debris {
    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 100;

    width: 12px;
    height: 30px;

    pointer-events: none;

    background:
        linear-gradient(
            135deg,
            #d4f2ff,
            #168fff,
            #062a62
        );

    clip-path:
        polygon(
            50% 0%,
            100% 35%,
            70% 100%,
            10% 80%,
            0% 30%
        );

    filter:
        drop-shadow(
            0 0 8px
            #21a4ff
        );

    animation:
        debrisExplosion
        var(--duration)
        cubic-bezier(.15,.7,.2,1)
        forwards;
}

@keyframes debrisExplosion {

    from {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            rotate(0)
            scale(1);
    }

    to {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotation))
            scale(.15);
    }

}


/* =========================================================
   FRAGMENT MENU
========================================================= */

.fragment-menu {
    position: absolute;

    inset: 0;

    z-index: 60;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .45s ease;
}

.fragment-menu.visible {
    opacity: 1;
    visibility: visible;
}


/* =========================================================
   FRAGMENT
========================================================= */

.fragment {
    position: absolute;

    left: 50%;
    top: 50%;

    width:
        var(--size, 175px);

    border: 0;

    background:
        transparent;

    padding: 0;

    cursor: pointer;

    opacity: 0;

    z-index: 70;

    transform:
        translate(-50%, -50%)
        scale(.03);

    transition:
        filter .3s ease,
        opacity .3s ease;

    will-change:
        left,
        top,
        transform;
}

.fragment.show {
    opacity: 1;

    animation:
        fragmentEnter
        1.3s
        cubic-bezier(.16,.9,.25,1.08)
        forwards;
}

@keyframes fragmentEnter {

    0% {
        left: 50%;
        top: 50%;

        transform:
            translate(-50%, -50%)
            scale(.03)
            rotate(0deg);
    }

    65% {
        left:
            var(--left);

        top:
            var(--top);

        transform:
            translate(-50%, -50%)
            scale(1.06)
            rotate(
                var(--rotation)
            );
    }

    100% {
        left:
            var(--left);

        top:
            var(--top);

        transform:
            translate(-50%, -50%)
            scale(1)
            rotate(
                var(--rotation)
            );
    }

}


/* =========================================================
   FLOAT
========================================================= */

.fragment-float {
    display: block;

    width: 100%;

    animation:
        fragmentFloat
        var(--float-speed, 8s)
        ease-in-out
        var(--float-delay, 0s)
        infinite
        alternate;

    will-change:
        transform;
}

.fragment img {
    display: block;

    width: 100%;

    pointer-events:
        none;

    user-select:
        none;

    filter:
        drop-shadow(
            0 0 12px
            rgba(20, 145, 255, .40)
        );

    transition:
        transform .3s ease,
        filter .3s ease;
}

@keyframes fragmentFloat {

    0% {
        transform:
            translate(
                calc(var(--move-x) * -1),
                calc(var(--move-y) * -1)
            )
            rotate(-2deg);
    }

    35% {
        transform:
            translate(
                calc(var(--move-x) * .35),
                var(--move-y)
            )
            rotate(1deg);
    }

    70% {
        transform:
            translate(
                var(--move-x),
                calc(var(--move-y) * -.25)
            )
            rotate(3deg);
    }

    100% {
        transform:
            translate(
                calc(var(--move-x) * -.45),
                calc(var(--move-y) * .45)
            )
            rotate(-1deg);
    }

}


/* =========================================================
   FRAGMENT POSITIONS
========================================================= */

.fragment-story {
    --left: 22%;
    --top: 22%;

    --size: 195px;

    --rotation: -8deg;

    --move-x: 10px;
    --move-y: 9px;

    --float-speed: 7.4s;
    --float-delay: -.8s;
}

.fragment-members {
    --left: 40%;
    --top: 18%;

    --size: 190px;

    --rotation: 5deg;

    --move-x: 9px;
    --move-y: 10px;

    --float-speed: 8.1s;
    --float-delay: -2.1s;
}

.fragment-discord {
    --left: 59%;
    --top: 20%;

    --size: 190px;

    --rotation: -5deg;

    --move-x: 10px;
    --move-y: 9px;

    --float-speed: 7.7s;
    --float-delay: -3.5s;
}

.fragment-ranks {
    --left: 78%;
    --top: 27%;

    --size: 185px;

    --rotation: 8deg;

    --move-x: 9px;
    --move-y: 10px;

    --float-speed: 8.7s;
    --float-delay: -1.4s;
}

.fragment-color {
    --left: 19%;
    --top: 50%;

    --size: 185px;

    --rotation: 7deg;

    --move-x: 9px;
    --move-y: 9px;

    --float-speed: 8.4s;
    --float-delay: -4.4s;
}

.fragment-outfit {
    --left: 39%;
    --top: 47%;

    --size: 188px;

    --rotation: -4deg;

    --move-x: 9px;
    --move-y: 10px;

    --float-speed: 7.5s;
    --float-delay: -2.9s;
}

.fragment-hood {
    --left: 61%;
    --top: 48%;

    --size: 185px;

    --rotation: 5deg;

    --move-x: 9px;
    --move-y: 9px;

    --float-speed: 8.9s;
    --float-delay: -5s;
}

.fragment-background {
    --left: 81%;
    --top: 53%;

    --size: 185px;

    --rotation: -6deg;

    --move-x: 9px;
    --move-y: 10px;

    --float-speed: 7.9s;
    --float-delay: -1.8s;
}

.fragment-values {
    --left: 32%;
    --top: 77%;

    --size: 215px;

    --rotation: -4deg;

    --move-x: 10px;
    --move-y: 9px;

    --float-speed: 8.3s;
    --float-delay: -3.8s;
}

.fragment-gallery {
    --left: 67%;
    --top: 78%;

    --size: 205px;

    --rotation: 4deg;

    --move-x: 9px;
    --move-y: 10px;

    --float-speed: 7.2s;
    --float-delay: -2.5s;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover: hover) {

    .fragment:hover {
        z-index: 150;

        filter:
            brightness(1.25)
            drop-shadow(
                0 0 18px
                rgba(70, 185, 255, .92)
            )
            drop-shadow(
                0 0 50px
                rgba(0, 105, 255, .48)
            );
    }

    .fragment:hover img {
        transform:
            scale(1.08);

        filter:
            brightness(1.18)
            drop-shadow(
                0 0 20px
                rgba(85, 195, 255, .80)
            );
    }

}


/* =========================================================
   CONTENT SCREEN
========================================================= */

.content-screen {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 40px;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 90, 210, .17),
            transparent 55%
        ),
        rgba(2, 2, 3, .96);

    backdrop-filter:
        blur(18px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}

.content-screen.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   CONTENT BOX
========================================================= */

.content-box {
    width:
        min(900px, 92vw);

    min-height:
        460px;

    padding:
        65px;

    border:
        1px solid
        rgba(35, 150, 255, .30);

    background:
        linear-gradient(
            145deg,
            rgba(7, 15, 28, .97),
            rgba(5, 5, 7, .97)
        );

    box-shadow:
        0 0 80px
        rgba(0, 105, 230, .15);

    transform:
        translateY(30px)
        scale(.97);

    transition:
        transform .5s
        cubic-bezier(.2,.8,.2,1);
}

.content-screen.active
.content-box {
    transform:
        translateY(0)
        scale(1);
}

.content-label {
    color:
        #299fff;

    font-size:
        11px;

    font-weight:
        bold;

    letter-spacing:
        6px;

    text-transform:
        uppercase;
}

.content-title {
    margin-top:
        15px;

    font-size:
        clamp(
            45px,
            6vw,
            85px
        );

    letter-spacing:
        -4px;

    text-transform:
        uppercase;
}

.content-text {
    margin-top:
        28px;

    max-width:
        680px;

    color:
        #8f9bad;

    font-size:
        16px;

    line-height:
        1.9;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {
    margin-top:
        42px;

    padding:
        14px
        28px;

    color:
        white;

    background:
        transparent;

    border:
        1px solid
        rgba(30, 155, 255, .60);

    font-size:
        10px;

    letter-spacing:
        4px;

    text-transform:
        uppercase;

    cursor:
        pointer;

    transition:
        .3s ease;
}

.back-button:hover {
    background:
        #087eea;

    border-color:
        #087eea;

    box-shadow:
        0 0 25px
        rgba(8, 126, 234, .45);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {
    position:
        absolute;

    right:
        35px;

    bottom:
        27px;

    z-index:
        200;

    border:
        0;

    background:
        none;

    color:
        #3e4b5e;

    font-size:
        9px;

    letter-spacing:
        4px;

    cursor:
        pointer;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        .3s;
}

.reset-button.visible {
    opacity:
        1;

    pointer-events:
        auto;
}

.reset-button:hover {
    color:
        #219cff;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    body {
        overflow-y:
            auto;
    }

    .page {
        height:
            1050px;
    }

    .logo {
        top:
            24px;

        left:
            22px;

        font-size:
            15px;

        letter-spacing:
            5px;
    }

    .established {
        right:
            22px;

        top:
            27px;

        font-size:
            7px;

        letter-spacing:
            4px;
    }

    .amethyst-wrapper {
        width:
            min(
                350px,
                75vw
            );
    }

    .fragment {
        --size:
            120px;
    }

    .fragment-story {
        --left: 27%;
        --top: 24%;
    }

    .fragment-members {
        --left: 65%;
        --top: 23%;
    }

    .fragment-discord {
        --left: 28%;
        --top: 39%;
    }

    .fragment-ranks {
        --left: 67%;
        --top: 39%;
    }

    .fragment-color {
        --left: 27%;
        --top: 54%;
    }

    .fragment-outfit {
        --left: 67%;
        --top: 54%;
    }

    .fragment-hood {
        --left: 27%;
        --top: 68%;
    }

    .fragment-background {
        --left: 67%;
        --top: 68%;
    }

    .fragment-values {
        --left: 28%;
        --top: 83%;

        --size: 135px;
    }

    .fragment-gallery {
        --left: 66%;
        --top: 83%;

        --size: 130px;
    }

    .content-box {
        min-height:
            auto;

        padding:
            32px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media
(prefers-reduced-motion: reduce) {

    * {
        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;
    }

}

</style>

</head>


<body>


<div
    class="boot-screen"
    id="bootScreen"
></div>


<div
    class="page"
    id="page"
>


    <div
        class="background-glow"
    ></div>


    <div
        class="logo"
    >

        NO <span>MERCY</span>

    </div>


    <div
        class="established"
    >

        EST. 2026

    </div>


    <!-- INTRO -->

    <div
        class="intro"
        id="intro"
    >


        <div
            class="intro-title"
            id="introTitle"
        >

            NO MERCY

        </div>


        <div
            class="amethyst-wrapper"
            id="amethystButton"
            role="button"
            tabindex="0"
            aria-label="Amethyst öffnen"
        >


            <img
                src="amethyst.png"
                id="amethyst"
                class="amethyst"
                alt="No Mercy Crystal"
            >


        </div>


        <div
            class="ground-light"
            id="groundLight"
        ></div>


        <div
            class="click-text"
            id="clickText"
        >

            CLICK TO SHATTER

        </div>


    </div>


    <!-- FRAGMENT MENU -->

    <div
        class="fragment-menu"
        id="fragmentMenu"
    >


        <button
            class="fragment fragment-story"
            data-section="story"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-story.png"
                    alt="Story"
                >

            </span>

        </button>


        <button
            class="fragment fragment-members"
            data-section="members"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-members.png"
                    alt="Mitglieder"
                >

            </span>

        </button>


        <button
            class="fragment fragment-discord"
            data-section="discord"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-discord.png"
                    alt="Discord"
                >

            </span>

        </button>


        <button
            class="fragment fragment-ranks"
            data-section="ranks"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-ranks.png"
                    alt="Ränge"
                >

            </span>

        </button>


        <button
            class="fragment fragment-color"
            data-section="color"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-color.png"
                    alt="Farbe"
                >

            </span>

        </button>


        <button
            class="fragment fragment-outfit"
            data-section="outfit"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-outfit.png"
                    alt="Outfit"
                >

            </span>

        </button>


        <button
            class="fragment fragment-hood"
            data-section="hood"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-hood.png"
                    alt="Hood"
                >

            </span>

        </button>


        <button
            class="fragment fragment-background"
            data-section="background"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-background.png"
                    alt="Hintergrund"
                >

            </span>

        </button>


        <button
            class="fragment fragment-values"
            data-section="values"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-values.png"
                    alt="Werte und Ziele"
                >

            </span>

        </button>


        <button
            class="fragment fragment-gallery"
            data-section="gallery"
            type="button"
        >

            <span class="fragment-float">

                <img
                    src="fragment-gallery.png"
                    alt="Galerie"
                >

            </span>

        </button>


    </div>


    <button
        class="reset-button"
        id="resetButton"
        type="button"
    >

        CRYSTAL RESET

    </button>


</div>


<div
    class="flash"
    id="flash"
></div>


<div
    class="shockwave"
    id="shockwave"
></div>


<!-- CONTENT -->

<div
    class="content-screen"
    id="contentScreen"
>


    <div
        class="content-box"
    >


        <div
            class="content-label"
            id="contentLabel"
        >

            NO MERCY

        </div>


        <h1
            class="content-title"
            id="contentTitle"
        >

            STORY

        </h1>


        <p
            class="content-text"
            id="contentText"
        >

            Inhalt folgt.

        </p>


        <button
            class="back-button"
            id="backButton"
            type="button"
        >

            ← ZURÜCK

        </button>


    </div>


</div>


<script>


const page =
    document.getElementById(
        "page"
    );


const bootScreen =
    document.getElementById(
        "bootScreen"
    );


const intro =
    document.getElementById(
        "intro"
    );


const introTitle =
    document.getElementById(
        "introTitle"
    );


const amethystButton =
    document.getElementById(
        "amethystButton"
    );


const amethyst =
    document.getElementById(
        "amethyst"
    );


const clickText =
    document.getElementById(
        "clickText"
    );


const groundLight =
    document.getElementById(
        "groundLight"
    );


const flash =
    document.getElementById(
        "flash"
    );


const shockwave =
    document.getElementById(
        "shockwave"
    );


const fragmentMenu =
    document.getElementById(
        "fragmentMenu"
    );


const fragments =
    document.querySelectorAll(
        ".fragment"
    );


const contentScreen =
    document.getElementById(
        "contentScreen"
    );


const contentTitle =
    document.getElementById(
        "contentTitle"
    );


const contentLabel =
    document.getElementById(
        "contentLabel"
    );


const contentText =
    document.getElementById(
        "contentText"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


let hasBroken =
    false;


let introReady =
    false;


/* =========================================================
   CONTENT
========================================================= */

const sections = {

    story: {
        label:
            "THE BEGINNING",

        title:
            "GESCHICHTE",

        text:
            "Hier kommt später die vollständige Geschichte von No Mercy hin."
    },

    members: {
        label:
            "THE FAMILY",

        title:
            "MITGLIEDER",

        text:
            "Hier kommen mindestens 25 Mitglieder inklusive ihrer Discord-Namen hin."
    },

    discord: {
        label:
            "COMMUNICATION",

        title:
            "DISCORD",

        text:
            "Hier kommt der Einladungslink zu eurem Fraktions-Discord hin."
    },

    ranks: {
        label:
            "HIERARCHY",

        title:
            "RÄNGE",

        text:
            "Hier wird später die komplette Rangstruktur von No Mercy dargestellt."
    },

    color: {
        label:
            "IDENTITY",

        title:
            "FRAKTIONSFARBE",

        text:
            "Hier präsentieren wir eure Fraktionsfarbe und die dazugehörige Autofarbe."
    },

    outfit: {
        label:
            "APPEARANCE",

        title:
            "OUTFIT",

        text:
            "Hier kommen eure Fraktions-Outfits inklusive Bildern hinein."
    },

    hood: {
        label:
            "OUR TERRITORY",

        title:
            "ANWESEN / HOOD",

        text:
            "Hier präsentieren wir das gewünschte Anwesen beziehungsweise eure Hood."
    },

    background: {
        label:
            "THE FOUNDATION",

        title:
            "HINTERGRUND",

        text:
            "Hier erklären wir den Hintergrund, die Identität und die Idee hinter No Mercy."
    },

    values: {
        label:
            "OUR CODE",

        title:
            "WERTE & ZIELE",

        text:
            "Hier kommen eure Werte, Prinzipien und langfristigen Ziele hin."
    },

    gallery: {
        label:
            "MOMENTS",

        title:
            "GALERIE",

        text:
            "Hier entsteht später eine Galerie mit euren wichtigsten Bildern und Momenten."
    }

};


/* =========================================================
   BOOT SEQUENCE
========================================================= */

window.addEventListener(
    "load",
    () => {


        setTimeout(
            () => {

                bootScreen.classList.add(
                    "fade-out"
                );

            },
            650
        );


        setTimeout(
            () => {

                intro.classList.add(
                    "intro-visible"
                );

            },
            1100
        );


        setTimeout(
            () => {

                introTitle.classList.add(
                    "visible"
                );

            },
            1500
        );


        setTimeout(
            () => {

                amethystButton.classList.add(
                    "ready"
                );

                clickText.classList.add(
                    "ready"
                );

                introReady =
                    true;

            },
            2050
        );


        setTimeout(
            () => {

                bootScreen.remove();

            },
            2300
        );


    }
);


/* =========================================================
   PARTICLES
========================================================= */

function createParticle() {


    const particle =
        document.createElement(
            "div"
        );


    const size =
        1 +
        Math.random() * 3;


    particle.style.position =
        "absolute";


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particle.style.borderRadius =
        "50%";


    particle.style.background =
        "#159cff";


    particle.style.boxShadow =
        "0 0 8px #159cff";


    particle.style.opacity =
        Math.random() * .45;


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.top =
        Math.random() * 100 + "%";


    particle.style.pointerEvents =
        "none";


    particle.style.zIndex =
        "2";


    page.appendChild(
        particle
    );

}


for (
    let i = 0;
    i < 50;
    i++
) {

    createParticle();

}


/* =========================================================
   BREAK CRYSTAL
========================================================= */

function breakAmethyst() {


    if (
        hasBroken ||
        !introReady
    ) {

        return;

    }


    hasBroken =
        true;


    amethystButton.style.animation =
        "none";


    amethystButton.classList.add(
        "charging"
    );


    clickText.style.opacity =
        "0";


    /* FLASH + SHOCK */

    setTimeout(
        () => {


            flash.classList.add(
                "active"
            );


            shockwave.classList.add(
                "active"
            );


            document.body.classList.add(
                "screen-shake"
            );


            setTimeout(
                () => {

                    document.body.classList.remove(
                        "screen-shake"
                    );

                },
                420
            );


        },
        600
    );


    /* EXPLOSION */

    setTimeout(
        () => {


            createDebrisExplosion();


            amethyst.style.opacity =
                "0";


            amethyst.style.transform =
                "scale(.1)";


            groundLight.style.opacity =
                ".12";


        },
        670
    );


    /* INTRO AWAY */

    setTimeout(
        () => {


            intro.style.opacity =
                "0";


            intro.style.transform =
                "translate(-50%, -50%) scale(.8)";


        },
        820
    );


    /* FRAGMENTS */

    setTimeout(
        () => {


            intro.style.display =
                "none";


            fragmentMenu.classList.add(
                "visible"
            );


            fragments.forEach(
                (
                    fragment,
                    index
                ) => {


                    setTimeout(
                        () => {


                            fragment.classList.add(
                                "show"
                            );


                        },
                        index * 55
                    );


                }
            );


            resetButton.classList.add(
                "visible"
            );


        },
        1020
    );


}


/* =========================================================
   CLICK
========================================================= */

amethystButton.addEventListener(
    "click",
    breakAmethyst
);


amethystButton.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Enter" ||
            event.key === " "
        ) {


            event.preventDefault();


            breakAmethyst();


        }


    }
);


/* =========================================================
   DEBRIS
========================================================= */

function createDebrisExplosion() {


    const amount =
        75;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const debris =
            document.createElement(
                "div"
            );


        debris.className =
            "debris";


        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance =
            130
            +
            Math.random()
            * 550;


        const x =
            Math.cos(angle)
            *
            distance;


        const y =
            Math.sin(angle)
            *
            distance;


        const rotation =
            Math.random()
            * 1600
            -
            800;


        const duration =
            .7
            +
            Math.random()
            * .65;


        const size =
            5
            +
            Math.random()
            * 17;


        debris.style.width =
            size + "px";


        debris.style.height =
            (
                size
                *
                (
                    1.4
                    +
                    Math.random()
                )
            )
            +
            "px";


        debris.style.setProperty(
            "--x",
            x + "px"
        );


        debris.style.setProperty(
            "--y",
            y + "px"
        );


        debris.style.setProperty(
            "--rotation",
            rotation + "deg"
        );


        debris.style.setProperty(
            "--duration",
            duration + "s"
        );


        document.body.appendChild(
            debris
        );


        setTimeout(
            () => {

                debris.remove();

            },
            1500
        );


    }

}


/* =========================================================
   FRAGMENT CLICK
========================================================= */

fragments.forEach(
    fragment => {


        fragment.addEventListener(
            "click",
            () => {


                const sectionName =
                    fragment.dataset.section;


                const section =
                    sections[
                        sectionName
                    ];


                if (!section) {

                    return;

                }


                contentLabel.textContent =
                    section.label;


                contentTitle.textContent =
                    section.title;


                contentText.textContent =
                    section.text;


                contentScreen.classList.add(
                    "active"
                );


            }
        );


    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    () => {


        contentScreen.classList.remove(
            "active"
        );


    }
);


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Escape"
        ) {


            contentScreen.classList.remove(
                "active"
            );


        }


    }
);


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
    "click",
    () => {


        location.reload();


    }
);


</script>


</body>

</html>
