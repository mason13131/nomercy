<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>No Mercy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at center, rgba(110, 20, 170, 0.16), transparent 38%),
        #030304;
      color: white;
    }

    .page {
      width: 100%;
      height: 100vh;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .background-glow {
      position: absolute;

      width: 900px;
      height: 900px;

      border-radius: 50%;

      background: rgba(115, 20, 180, 0.18);

      filter: blur(220px);

      pointer-events: none;
    }

    .logo {
      position: absolute;

      top: 40px;
      left: 55px;

      font-size: 22px;
      font-weight: 900;

      letter-spacing: 8px;

      z-index: 20;
    }

    .logo span {
      color: #b94dff;

      text-shadow:
        0 0 12px rgba(185, 77, 255, 0.7),
        0 0 25px rgba(185, 77, 255, 0.3);
    }

    .established {
      position: absolute;

      top: 45px;
      right: 55px;

      color: #777;

      font-size: 11px;

      letter-spacing: 7px;

      z-index: 20;
    }

    .fragment-area {
      position: relative;

      width: 380px;

      cursor: pointer;

      animation: floatFragment 3.5s ease-in-out infinite;
    }

    @keyframes floatFragment {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-14px);
      }
    }

    .fragment-img {
      width: 100%;

      display: block;

      filter:
        drop-shadow(0 0 18px rgba(180, 80, 255, 0.45))
        drop-shadow(0 0 45px rgba(120, 30, 180, 0.25));

      transition: 0.35s ease;
    }

    .fragment-area:hover .fragment-img {
      transform: scale(1.035);

      filter:
        brightness(1.1)
        drop-shadow(0 0 24px rgba(200, 110, 255, 0.7))
        drop-shadow(0 0 60px rgba(140, 45, 220, 0.4));
    }

    .engraving {
      position: absolute;

      left: 50%;
      top: 54%;

      transform: translate(-50%, -50%);

      font-size: 34px;

      font-weight: 900;

      letter-spacing: 6px;

      color: rgba(40, 8, 60, 0.92);

      text-transform: uppercase;

      text-shadow:
        0 2px 1px rgba(255, 180, 255, 0.18),
        0 -2px 2px rgba(0, 0, 0, 0.95),
        1px 0 1px rgba(0, 0, 0, 0.6);

      transition: 0.35s ease;

      pointer-events: none;
    }

    .fragment-area:hover .engraving {
      color: #b94dff;

      text-shadow:
        0 0 4px #f0c6ff,
        0 0 10px #cf70ff,
        0 0 22px #9d31e8,
        0 2px 1px rgba(255,255,255,0.25);

      transform:
        translate(-50%, -50%)
        scale(1.03);
    }

    .hint {
      position: absolute;

      bottom: 45px;

      font-size: 10px;

      letter-spacing: 6px;

      color: #625b67;

      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .fragment-area {
        width: 75vw;
      }

      .engraving {
        font-size: 25px;
        letter-spacing: 4px;
      }

      .logo {
        top: 25px;
        left: 25px;

        font-size: 17px;
        letter-spacing: 5px;
      }

      .established {
        top: 30px;
        right: 25px;

        font-size: 8px;
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="background-glow"></div>

    <div class="logo">
      NO <span>MERCY</span>
    </div>

    <div class="established">
      EST. 2026
    </div>

    <div class="fragment-area">

      <img
        src="fragment-story.png"
        alt="Story Fragment"
        class="fragment-img"
      >

      <div class="engraving">
        STORY
      </div>

    </div>

    <div class="hint">
      Hover the fragment
    </div>

  </div>

</body>
</html>
