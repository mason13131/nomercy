<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>No Mercy</title>


<style>


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    height: 100%;
}


body {

    overflow: hidden;

    background:

        radial-gradient(
            circle at 50% 48%,
            rgba(112, 24, 165, 0.18),
            transparent 42%
        ),

        #020203;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   PAGE
========================================================= */

.page {

    position: relative;

    width: 100%;
    height: 100vh;

    overflow: hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {

    position: absolute;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(120, 30, 180, .18);

    filter:
        blur(220px);

    pointer-events: none;

    animation:
        backgroundPulse
        6s
        ease-in-out
        infinite
        alternate;
}


@keyframes backgroundPulse {

    from {

        opacity: .35;

        transform:
            translate(-50%, -50%)
            scale(.92);

    }

    to {

        opacity: .7;

        transform:
            translate(-50%, -50%)
            scale(1.08);

    }

}


/* =========================================================
   LOGO
========================================================= */

.logo {

    position: absolute;

    top: 38px;
    left: 52px;

    z-index: 200;

    font-size: 21px;

    font-weight: 900;

    letter-spacing: 8px;
}


.logo span {

    color: #b94cff;

    text-shadow:

        0 0 10px
        rgba(185, 76, 255, .8),

        0 0 30px
        rgba(185, 76, 255, .35);
}


.established {

    position: absolute;

    top: 44px;
    right: 52px;

    z-index: 200;

    color: #77717d;

    font-size: 10px;

    letter-spacing: 7px;
}


/* =========================================================
   INTRO
========================================================= */

.intro {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    display: flex;

    flex-direction: column;

    align-items: center;

    z-index: 50;

    transition:

        opacity .6s ease,

        transform .6s ease;
}


/* =========================================================
   MAIN AMETHYST
========================================================= */

.amethyst-wrapper {

    position: relative;

    width:
        min(410px, 60vw);

    cursor: pointer;

    animation:
        crystalFloat
        4s
        ease-in-out
        infinite;

    transition:
        filter .35s ease;
}


@keyframes crystalFloat {

    0%,
    100% {

        transform:
            translateY(0)
            rotate(-1deg);

    }

    50% {

        transform:
            translateY(-17px)
            rotate(1deg);

    }

}


.amethyst {

    display: block;

    width: 100%;

    user-select: none;

    pointer-events: none;

    filter:

        drop-shadow(
            0 0 18px
            rgba(184, 72, 255, .5)
        )

        drop-shadow(
            0 0 65px
            rgba(112, 20, 190, .25)
        );

    transition:

        transform .35s ease,

        filter .35s ease,

        opacity .3s ease;
}


.amethyst-wrapper:hover .amethyst {

    transform:
        scale(1.035);

    filter:

        brightness(1.15)

        drop-shadow(
            0 0 28px
            rgba(210, 120, 255, .85)
        )

        drop-shadow(
            0 0 80px
            rgba(135, 30, 220, .45)
        );
}


/* =========================================================
   GROUND LIGHT
========================================================= */

.ground-light {

    width: 260px;

    height: 8px;

    margin-top: -12px;

    border-radius: 50%;

    background:
        #c54dff;

    filter:
        blur(9px);

    opacity: .7;

    box-shadow:

        0 0 30px
        rgba(197, 77, 255, .8),

        0 0 70px
        rgba(123, 20, 190, .45);

    transition:
        opacity .4s ease;
}


/* =========================================================
   CLICK TEXT
========================================================= */

.click-text {

    margin-top: 38px;

    font-size: 11px;

    color: #9b94a0;

    letter-spacing: 8px;

    text-transform: uppercase;

    animation:
        clickPulse
        2s
        ease-in-out
        infinite;

    transition:
        opacity .4s ease;
}


@keyframes clickPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   CHARGING
========================================================= */

.amethyst-wrapper.charging {

    animation:
        charge
        .7s
        ease-in-out
        forwards;
}


@keyframes charge {

    0% {

        transform:
            scale(1);

    }

    30% {

        transform:
            scale(.96);

    }

    65% {

        transform:
            scale(1.06);

        filter:

            brightness(1.7)

            drop-shadow(
                0 0 55px
                rgba(230, 150, 255, 1)
            );

    }

    100% {

        transform:
            scale(1.12);

        filter:

            brightness(2.4)

            drop-shadow(
                0 0 110px
                rgba(235, 180, 255, 1)
            );

    }

}


/* =========================================================
   FLASH
========================================================= */

.flash {

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    opacity: 0;

    background:

        radial-gradient(

            circle at center,

            #ffffff 0%,

            #e8baff 12%,

            #be62f5 32%,

            rgba(130, 30, 190, .5) 50%,

            transparent 75%

        );
}


.flash.active {

    animation:
        flashBang
        .45s
        ease-out
        forwards;
}


@keyframes flashBang {

    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    45% {
        opacity: .7;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   SHOCKWAVE
========================================================= */

.shockwave {

    position: fixed;

    left: 50%;
    top: 50%;

    width: 70px;
    height: 70px;

    transform:
        translate(-50%, -50%);

    border:

        3px solid
        #d281ff;

    border-radius: 50%;

    opacity: 0;

    pointer-events: none;

    z-index: 90;
}


.shockwave.active {

    animation:
        shockwaveAnimation
        1s
        ease-out
        forwards;
}


@keyframes shockwaveAnimation {

    from {

        width: 70px;
        height: 70px;

        opacity: 1;

        box-shadow:
            0 0 50px
            #b642ff;

    }

    to {

        width: 1100px;
        height: 1100px;

        opacity: 0;

        border-width: 1px;

    }

}


/* =========================================================
   EXPLOSION DEBRIS
========================================================= */

.debris {

    position: fixed;

    left: 50%;
    top: 50%;

    z-index: 100;

    width: 12px;
    height: 30px;

    pointer-events: none;

    background:

        linear-gradient(

            135deg,

            #f0c6ff,

            #b744f4,

            #47105d

        );

    clip-path:

        polygon(

            50% 0%,

            100% 35%,

            70% 100%,

            10% 80%,

            0% 30%

        );

    filter:

        drop-shadow(
            0 0 8px
            #bc55ff
        );

    animation:

        debrisExplosion

        var(--duration)

        cubic-bezier(.15,.7,.2,1)

        forwards;
}


@keyframes debrisExplosion {

    from {

        opacity: 1;

        transform:

            translate(-50%, -50%)

            rotate(0)

            scale(1);

    }

    to {

        opacity: 0;

        transform:

            translate(

                calc(-50% + var(--x)),

                calc(-50% + var(--y))

            )

            rotate(var(--rotation))

            scale(.15);

    }

}


/* =========================================================
   FRAGMENT MENU
========================================================= */

.fragment-menu {

    position: absolute;

    inset: 0;

    z-index: 60;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .45s ease;
}


.fragment-menu.visible {

    opacity: 1;

    visibility: visible;
}


/* =========================================================
   FRAGMENT
========================================================= */

.fragment {

    position: absolute;

    left: 50%;
    top: 50%;

    width:
        var(--size, 175px);

    border: 0;

    background: transparent;

    padding: 0;

    cursor: pointer;

    opacity: 0;

    z-index: 70;

    transform:

        translate(-50%, -50%)

        scale(.03);

    transition:

        filter .3s ease,

        opacity .3s ease;

    will-change:
        left,
        top,
        transform;
}


/*

Der Button bewegt sich zur Zielposition.

Die innere Ebene bewegt sich danach dauerhaft.

*/

.fragment.show {

    opacity: 1;

    animation:

        fragmentEnter

        1.3s

        cubic-bezier(.16,.9,.25,1.08)

        forwards;
}


@keyframes fragmentEnter {

    0% {

        left: 50%;
        top: 50%;

        transform:

            translate(-50%, -50%)

            scale(.03)

            rotate(0deg);

    }

    65% {

        left:
            var(--left);

        top:
            var(--top);

        transform:

            translate(-50%, -50%)

            scale(1.06)

            rotate(
                var(--rotation)
            );

    }

    100% {

        left:
            var(--left);

        top:
            var(--top);

        transform:

            translate(-50%, -50%)

            scale(1)

            rotate(
                var(--rotation)
            );

    }

}


/* =========================================================
   INNER FLOAT WRAPPER
========================================================= */

.fragment-float {

    display: block;

    width: 100%;

    animation:

        fragmentFloat

        var(--float-speed, 8s)

        ease-in-out

        var(--float-delay, 0s)

        infinite

        alternate;

    will-change:
        transform;
}


.fragment img {

    display: block;

    width: 100%;

    pointer-events: none;

    user-select: none;

    filter:

        drop-shadow(
            0 0 12px
            rgba(175, 65, 245, .35)
        );

    transition:

        transform .3s ease,

        filter .3s ease;
}


/* =========================================================
   PERMANENT MOVEMENT
========================================================= */

@keyframes fragmentFloat {

    0% {

        transform:

            translate(
                calc(var(--move-x) * -1),
                calc(var(--move-y) * -1)
            )

            rotate(-2deg);

    }

    35% {

        transform:

            translate(
                calc(var(--move-x) * .35),
                var(--move-y)
            )

            rotate(1deg);

    }

    70% {

        transform:

            translate(
                var(--move-x),
                calc(var(--move-y) * -.25)
            )

            rotate(3deg);

    }

    100% {

        transform:

            translate(
                calc(var(--move-x) * -.45),
                calc(var(--move-y) * .45)
            )

            rotate(-1deg);

    }

}


/* =========================================================
   INDIVIDUAL POSITIONS
========================================================= */

/*

Alles bewusst relativ nah an der Mitte.

So bleibt auf 16:9 alles sichtbar.

*/

.fragment-story {

    --left: 27%;
    --top: 28%;

    --size: 175px;

    --rotation: -8deg;

    --move-x: 30px;
    --move-y: 22px;

    --float-speed: 7.4s;
    --float-delay: -.8s;
}


.fragment-members {

    --left: 43%;
    --top: 25%;

    --size: 170px;

    --rotation: 5deg;

    --move-x: 24px;
    --move-y: 32px;

    --float-speed: 8.1s;
    --float-delay: -2.1s;
}


.fragment-discord {

    --left: 60%;
    --top: 27%;

    --size: 170px;

    --rotation: -5deg;

    --move-x: 34px;
    --move-y: 20px;

    --float-speed: 7.7s;
    --float-delay: -3.5s;
}


.fragment-ranks {

    --left: 74%;
    --top: 35%;

    --size: 165px;

    --rotation: 8deg;

    --move-x: 23px;
    --move-y: 30px;

    --float-speed: 8.7s;
    --float-delay: -1.4s;
}


.fragment-color {

    --left: 26%;
    --top: 50%;

    --size: 165px;

    --rotation: 7deg;

    --move-x: 31px;
    --move-y: 25px;

    --float-speed: 8.4s;
    --float-delay: -4.4s;
}


.fragment-outfit {

    --left: 44%;
    --top: 48%;

    --size: 168px;

    --rotation: -4deg;

    --move-x: 25px;
    --move-y: 35px;

    --float-speed: 7.5s;
    --float-delay: -2.9s;
}


.fragment-hood {

    --left: 61%;
    --top: 49%;

    --size: 165px;

    --rotation: 5deg;

    --move-x: 29px;
    --move-y: 23px;

    --float-speed: 8.9s;
    --float-delay: -5s;
}


.fragment-background {

    --left: 75%;
    --top: 58%;

    --size: 165px;

    --rotation: -6deg;

    --move-x: 25px;
    --move-y: 33px;

    --float-speed: 7.9s;
    --float-delay: -1.8s;
}


.fragment-values {

    --left: 37%;
    --top: 72%;

    --size: 190px;

    --rotation: -4deg;

    --move-x: 34px;
    --move-y: 22px;

    --float-speed: 8.3s;
    --float-delay: -3.8s;
}


.fragment-gallery {

    --left: 60%;
    --top: 72%;

    --size: 185px;

    --rotation: 4deg;

    --move-x: 28px;
    --move-y: 30px;

    --float-speed: 7.2s;
    --float-delay: -2.5s;
}


/* =========================================================
   HOVER
========================================================= */

@media (hover: hover) {

    .fragment:hover {

        z-index: 150;

        filter:

            brightness(1.25)

            drop-shadow(
                0 0 18px
                rgba(205, 100, 255, .9)
            )

            drop-shadow(
                0 0 50px
                rgba(135, 25, 220, .45)
            );
    }


    .fragment:hover img {

        transform:
            scale(1.08);

        filter:

            brightness(1.18)

            drop-shadow(
                0 0 20px
                rgba(210, 110, 255, .75)
            );

    }

}


/* =========================================================
   CONTENT SCREEN
========================================================= */

.content-screen {

    position: fixed;

    inset: 0;

    z-index: 500;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px;

    background:

        radial-gradient(

            circle at center,

            rgba(100, 20, 150, .15),

            transparent 55%

        ),

        rgba(2, 2, 3, .96);

    backdrop-filter:
        blur(18px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:

        opacity .45s ease,

        visibility .45s ease;
}


.content-screen.active {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* =========================================================
   CONTENT BOX
========================================================= */

.content-box {

    width:
        min(900px, 92vw);

    min-height: 460px;

    padding: 65px;

    border:

        1px solid
        rgba(179, 75, 245, .28);

    background:

        linear-gradient(

            145deg,

            rgba(18, 10, 23, .97),

            rgba(5, 5, 7, .97)

        );

    box-shadow:

        0 0 80px
        rgba(125, 30, 190, .12);

    transform:

        translateY(30px)

        scale(.97);

    transition:

        transform .5s
        cubic-bezier(.2,.8,.2,1);
}


.content-screen.active
.content-box {

    transform:

        translateY(0)

        scale(1);
}


.content-label {

    color: #ab4be8;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 6px;

    text-transform: uppercase;
}


.content-title {

    margin-top: 15px;

    font-size:

        clamp(
            45px,
            6vw,
            85px
        );

    letter-spacing: -4px;

    text-transform: uppercase;
}


.content-text {

    margin-top: 28px;

    max-width: 680px;

    color: #918a97;

    font-size: 16px;

    line-height: 1.9;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.back-button {

    margin-top: 42px;

    padding:
        14px
        28px;

    color: white;

    background: transparent;

    border:

        1px solid
        rgba(177, 65, 235, .55);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        .3s ease;
}


.back-button:hover {

    background:
        #9e39d9;

    border-color:
        #9e39d9;

    box-shadow:

        0 0 25px
        rgba(158, 57, 217, .4);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {

    position: absolute;

    right: 35px;
    bottom: 27px;

    z-index: 200;

    border: 0;

    background: none;

    color:
        #454048;

    font-size: 9px;

    letter-spacing: 4px;

    cursor: pointer;

    opacity: 0;

    pointer-events: none;

    transition:
        .3s;
}


.reset-button.visible {

    opacity: 1;

    pointer-events: auto;
}


.reset-button:hover {

    color:
        #a549dc;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    body {

        overflow-y: auto;
    }


    .page {

        height: 1050px;
    }


    .logo {

        top: 24px;
        left: 22px;

        font-size: 15px;

        letter-spacing: 5px;
    }


    .established {

        right: 22px;
        top: 27px;

        font-size: 7px;

        letter-spacing: 4px;
    }


    .amethyst-wrapper {

        width:
            min(
                350px,
                75vw
            );
    }


    .fragment {

        --size: 120px;
    }


    .fragment-story {

        --left: 27%;
        --top: 24%;
    }


    .fragment-members {

        --left: 65%;
        --top: 23%;
    }


    .fragment-discord {

        --left: 28%;
        --top: 39%;
    }


    .fragment-ranks {

        --left: 67%;
        --top: 39%;
    }


    .fragment-color {

        --left: 27%;
        --top: 54%;
    }


    .fragment-outfit {

        --left: 67%;
        --top: 54%;
    }


    .fragment-hood {

        --left: 27%;
        --top: 68%;
    }


    .fragment-background {

        --left: 67%;
        --top: 68%;
    }


    .fragment-values {

        --left: 28%;
        --top: 83%;

        --size: 135px;
    }


    .fragment-gallery {

        --left: 66%;
        --top: 83%;

        --size: 130px;
    }


    .content-box {

        min-height: auto;

        padding: 32px;
    }


    .content-title {

        letter-spacing: -2px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media
(prefers-reduced-motion: reduce) {

    * {

        animation-duration:
            .01ms !important;

        animation-iteration-count:
            1 !important;

        scroll-behavior:
            auto !important;
    }

}


</style>

</head>



<body>


<div
    class="page"
    id="page"
>


    <div
        class="background-glow"
    ></div>


    <div class="logo">

        NO <span>MERCY</span>

    </div>


    <div class="established">

        EST. 2026

    </div>



    <!-- =====================================================
         INTRO
    ====================================================== -->

    <div
        class="intro"
        id="intro"
    >


        <div

            class="amethyst-wrapper"

            id="amethystButton"

            role="button"

            tabindex="0"

            aria-label="Amethyst öffnen"

        >


            <img

                src="amethyst.png"

                id="amethyst"

                class="amethyst"

                alt="No Mercy Amethyst"

            >


        </div>


        <div

            class="ground-light"

            id="groundLight"

        ></div>


        <div

            class="click-text"

            id="clickText"

        >

            CLICK THE AMETHYST

        </div>


    </div>



    <!-- =====================================================
         FRAGMENT MENU
    ====================================================== -->

    <div

        class="fragment-menu"

        id="fragmentMenu"

    >


        <button

            class="fragment fragment-story"

            data-section="story"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-story.png"
                    alt="Story"
                >

            </span>

        </button>



        <button

            class="fragment fragment-members"

            data-section="members"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-members.png"
                    alt="Mitglieder"
                >

            </span>

        </button>



        <button

            class="fragment fragment-discord"

            data-section="discord"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-discord.png"
                    alt="Discord"
                >

            </span>

        </button>



        <button

            class="fragment fragment-ranks"

            data-section="ranks"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-ranks.png"
                    alt="Ränge"
                >

            </span>

        </button>



        <button

            class="fragment fragment-color"

            data-section="color"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-color.png"
                    alt="Fraktionsfarbe"
                >

            </span>

        </button>



        <button

            class="fragment fragment-outfit"

            data-section="outfit"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-outfit.png"
                    alt="Outfit"
                >

            </span>

        </button>



        <button

            class="fragment fragment-hood"

            data-section="hood"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-hood.png"
                    alt="Hood"
                >

            </span>

        </button>



        <button

            class="fragment fragment-background"

            data-section="background"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-background.png"
                    alt="Hintergrund"
                >

            </span>

        </button>



        <button

            class="fragment fragment-values"

            data-section="values"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-values.png"
                    alt="Werte und Ziele"
                >

            </span>

        </button>



        <button

            class="fragment fragment-gallery"

            data-section="gallery"

            type="button"

        >

            <span class="fragment-float">

                <img
                    src="fragment-gallery.png"
                    alt="Galerie"
                >

            </span>

        </button>


    </div>



    <button

        class="reset-button"

        id="resetButton"

        type="button"

    >

        AMETHYST RESET

    </button>


</div>



<div
    class="flash"
    id="flash"
></div>


<div
    class="shockwave"
    id="shockwave"
></div>



<!-- =========================================================
     CONTENT
========================================================= -->

<div

    class="content-screen"

    id="contentScreen"

>


    <div class="content-box">


        <div

            class="content-label"

            id="contentLabel"

        >

            NO MERCY

        </div>


        <h1

            class="content-title"

            id="contentTitle"

        >

            STORY

        </h1>


        <p

            class="content-text"

            id="contentText"

        >

            Inhalt folgt.

        </p>


        <button

            class="back-button"

            id="backButton"

            type="button"

        >

            ← ZURÜCK

        </button>


    </div>


</div>



<script>


/* =========================================================
   ELEMENTS
========================================================= */

const page =
    document.getElementById(
        "page"
    );


const intro =
    document.getElementById(
        "intro"
    );


const amethystButton =
    document.getElementById(
        "amethystButton"
    );


const amethyst =
    document.getElementById(
        "amethyst"
    );


const clickText =
    document.getElementById(
        "clickText"
    );


const groundLight =
    document.getElementById(
        "groundLight"
    );


const flash =
    document.getElementById(
        "flash"
    );


const shockwave =
    document.getElementById(
        "shockwave"
    );


const fragmentMenu =
    document.getElementById(
        "fragmentMenu"
    );


const fragments =
    document.querySelectorAll(
        ".fragment"
    );


const contentScreen =
    document.getElementById(
        "contentScreen"
    );


const contentTitle =
    document.getElementById(
        "contentTitle"
    );


const contentLabel =
    document.getElementById(
        "contentLabel"
    );


const contentText =
    document.getElementById(
        "contentText"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


let hasBroken =
    false;


/* =========================================================
   CONTENT
========================================================= */

const sections = {


    story: {

        label:
            "THE BEGINNING",

        title:
            "GESCHICHTE",

        text:
            "Hier kommt später die vollständige Geschichte von No Mercy hin."

    },


    members: {

        label:
            "THE FAMILY",

        title:
            "MITGLIEDER",

        text:
            "Hier kommen mindestens 25 Mitglieder inklusive ihrer Discord-Namen hin."

    },


    discord: {

        label:
            "COMMUNICATION",

        title:
            "DISCORD",

        text:
            "Hier kommt der Einladungslink zu eurem Fraktions-Discord hin."

    },


    ranks: {

        label:
            "HIERARCHY",

        title:
            "RÄNGE",

        text:
            "Hier wird später die komplette Rangstruktur von No Mercy dargestellt."

    },


    color: {

        label:
            "IDENTITY",

        title:
            "FRAKTIONSFARBE",

        text:
            "Hier präsentieren wir eure Fraktionsfarbe und die dazugehörige Autofarbe."

    },


    outfit: {

        label:
            "APPEARANCE",

        title:
            "OUTFIT",

        text:
            "Hier kommen eure Fraktions-Outfits inklusive Bildern hinein."

    },


    hood: {

        label:
            "OUR TERRITORY",

        title:
            "ANWESEN / HOOD",

        text:
            "Hier präsentieren wir das gewünschte Anwesen beziehungsweise eure Hood."

    },


    background: {

        label:
            "THE FOUNDATION",

        title:
            "HINTERGRUND",

        text:
            "Hier erklären wir den Hintergrund, die Identität und die Idee hinter No Mercy."

    },


    values: {

        label:
            "OUR CODE",

        title:
            "WERTE & ZIELE",

        text:
            "Hier kommen eure Werte, Prinzipien und langfristigen Ziele hin."

    },


    gallery: {

        label:
            "MOMENTS",

        title:
            "GALERIE",

        text:
            "Hier entsteht später eine Galerie mit euren wichtigsten Bildern und Momenten."

    }


};


/* =========================================================
   BACKGROUND PARTICLES
========================================================= */

function createParticle() {


    const particle =
        document.createElement(
            "div"
        );


    const size =
        1 +
        Math.random() * 3;


    particle.style.position =
        "absolute";


    particle.style.width =
        size + "px";


    particle.style.height =
        size + "px";


    particle.style.borderRadius =
        "50%";


    particle.style.background =
        "#b44cff";


    particle.style.boxShadow =
        "0 0 8px #b44cff";


    particle.style.opacity =
        Math.random() * .45;


    particle.style.left =
        Math.random() * 100 + "%";


    particle.style.top =
        Math.random() * 100 + "%";


    particle.style.pointerEvents =
        "none";


    particle.style.zIndex =
        "2";


    page.appendChild(
        particle
    );

}


for (
    let i = 0;
    i < 50;
    i++
) {

    createParticle();

}


/* =========================================================
   BREAK AMETHYST
========================================================= */

function breakAmethyst() {


    if (hasBroken) {

        return;

    }


    hasBroken =
        true;


    amethystButton.style.animation =
        "none";


    amethystButton.classList.add(
        "charging"
    );


    clickText.style.opacity =
        "0";


    /*
        FLASH + SHOCKWAVE
    */

    setTimeout(
        () => {


            flash.classList.add(
                "active"
            );


            shockwave.classList.add(
                "active"
            );


        },
        600
    );


    /*
        EXPLOSION
    */

    setTimeout(
        () => {


            createDebrisExplosion();


            amethyst.style.opacity =
                "0";


            amethyst.style.transform =
                "scale(.1)";


            groundLight.style.opacity =
                ".12";


        },
        670
    );


    /*
        INTRO AWAY
    */

    setTimeout(
        () => {


            intro.style.opacity =
                "0";


            intro.style.transform =
                "translate(-50%, -50%) scale(.8)";


        },
        820
    );


    /*
        FRAGMENTS
    */

    setTimeout(
        () => {


            intro.style.display =
                "none";


            fragmentMenu.classList.add(
                "visible"
            );


            fragments.forEach(
                (
                    fragment,
                    index
                ) => {


                    setTimeout(
                        () => {


                            fragment.classList.add(
                                "show"
                            );


                        },
                        index * 55
                    );


                }
            );


            resetButton.classList.add(
                "visible"
            );


        },
        1020
    );


}


/* =========================================================
   MAIN CLICK
========================================================= */

amethystButton.addEventListener(
    "click",
    breakAmethyst
);


amethystButton.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Enter" ||
            event.key === " "
        ) {


            event.preventDefault();


            breakAmethyst();


        }


    }
);


/* =========================================================
   DEBRIS
========================================================= */

function createDebrisExplosion() {


    const amount =
        75;


    for (
        let i = 0;
        i < amount;
        i++
    ) {


        const debris =
            document.createElement(
                "div"
            );


        debris.className =
            "debris";


        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance =
            130
            +
            Math.random()
            * 550;


        const x =
            Math.cos(angle)
            *
            distance;


        const y =
            Math.sin(angle)
            *
            distance;


        const rotation =
            Math.random()
            * 1600
            -
            800;


        const duration =
            .7
            +
            Math.random()
            * .65;


        const size =
            5
            +
            Math.random()
            * 17;


        debris.style.width =
            size + "px";


        debris.style.height =
            (
                size
                *
                (
                    1.4
                    +
                    Math.random()
                )
            )
            +
            "px";


        debris.style.setProperty(
            "--x",
            x + "px"
        );


        debris.style.setProperty(
            "--y",
            y + "px"
        );


        debris.style.setProperty(
            "--rotation",
            rotation + "deg"
        );


        debris.style.setProperty(
            "--duration",
            duration + "s"
        );


        document.body.appendChild(
            debris
        );


        setTimeout(
            () => {

                debris.remove();

            },
            1500
        );


    }

}


/* =========================================================
   FRAGMENT CLICK
========================================================= */

fragments.forEach(
    fragment => {


        fragment.addEventListener(
            "click",
            () => {


                const sectionName =
                    fragment.dataset.section;


                const section =
                    sections[
                        sectionName
                    ];


                if (!section) {

                    return;

                }


                contentLabel.textContent =
                    section.label;


                contentTitle.textContent =
                    section.title;


                contentText.textContent =
                    section.text;


                contentScreen.classList.add(
                    "active"
                );


            }
        );


    }
);


/* =========================================================
   BACK
========================================================= */

backButton.addEventListener(
    "click",
    () => {


        contentScreen.classList.remove(
            "active"
        );


    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key === "Escape"
        ) {


            contentScreen.classList.remove(
                "active"
            );


        }


    }
);


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
    "click",
    () => {


        location.reload();


    }
);


</script>


</body>

</html>
