<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>No Mercy</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    overflow-x: hidden;
    overflow-y: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(105, 20, 160, 0.18),
            transparent 38%
        ),
        #020203;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   HAUPTSEITE
========================================================= */

.page {
    position: relative;

    width: 100%;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}


/* =========================================================
   HINTERGRUND
========================================================= */

.background-glow {
    position: absolute;

    width: 900px;
    height: 900px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(113, 25, 170, 0.18);

    filter: blur(220px);

    animation: backgroundPulse 6s ease-in-out infinite alternate;

    pointer-events: none;
}

@keyframes backgroundPulse {

    from {
        opacity: 0.4;
        transform:
            translate(-50%, -50%)
            scale(0.9);
    }

    to {
        opacity: 0.75;
        transform:
            translate(-50%, -50%)
            scale(1.1);
    }

}


/* =========================================================
   NO MERCY
========================================================= */

.logo {
    position: absolute;

    top: 38px;
    left: 52px;

    font-size: 21px;
    font-weight: 900;

    letter-spacing: 8px;

    z-index: 100;
}

.logo span {
    color: #b94cff;

    text-shadow:
        0 0 10px rgba(185, 76, 255, .8),
        0 0 30px rgba(185, 76, 255, .35);
}


.established {
    position: absolute;

    right: 52px;
    top: 44px;

    font-size: 10px;

    letter-spacing: 7px;

    color: #807987;

    z-index: 100;
}


/* =========================================================
   START AMETHYST
========================================================= */

.intro {
    position: relative;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 30;

    transition:
        opacity .6s ease,
        transform .6s ease;
}


.amethyst-wrapper {
    position: relative;

    width: min(410px, 60vw);

    cursor: pointer;

    animation:
        crystalFloat 4s ease-in-out infinite;

    transition:
        filter .35s ease,
        opacity .4s ease;
}


@keyframes crystalFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(-1deg);
    }

    50% {
        transform:
            translateY(-17px)
            rotate(1deg);
    }

}


.amethyst {
    display: block;

    width: 100%;

    user-select: none;

    pointer-events: none;

    filter:
        drop-shadow(
            0 0 18px
            rgba(184, 72, 255, .5)
        )
        drop-shadow(
            0 0 65px
            rgba(112, 20, 190, .25)
        );

    transition:
        transform .35s ease,
        filter .35s ease;
}


.amethyst-wrapper:hover .amethyst {
    transform: scale(1.035);

    filter:
        brightness(1.15)
        drop-shadow(
            0 0 28px
            rgba(210, 120, 255, .85)
        )
        drop-shadow(
            0 0 80px
            rgba(135, 30, 220, .45)
        );
}


/* LICHT UNTEN */

.ground-light {
    position: relative;

    width: 260px;
    height: 8px;

    margin-top: -12px;

    border-radius: 50%;

    background: #c54dff;

    filter: blur(9px);

    opacity: .7;

    box-shadow:
        0 0 30px rgba(197, 77, 255, .8),
        0 0 70px rgba(123, 20, 190, .45);

    transition: opacity .4s ease;
}


/* CLICK TEXT */

.click-text {
    margin-top: 38px;

    font-size: 11px;

    color: #9b94a0;

    letter-spacing: 8px;

    text-transform: uppercase;

    animation: clickPulse 2s ease-in-out infinite;

    transition: opacity .4s ease;
}


@keyframes clickPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }

}


/* =========================================================
   KRISTALL ENERGIE AUFLADEN
========================================================= */

.amethyst-wrapper.charging {
    animation: charge .7s ease-in-out forwards;
}


@keyframes charge {

    0% {
        transform: scale(1);
    }

    30% {
        transform: scale(.96);
    }

    65% {
        transform: scale(1.06);

        filter:
            brightness(1.7)
            drop-shadow(
                0 0 55px
                rgba(230, 150, 255, 1)
            );
    }

    100% {
        transform: scale(1.1);

        filter:
            brightness(2.3)
            drop-shadow(
                0 0 100px
                rgba(235, 180, 255, 1)
            );
    }

}


/* =========================================================
   SCREEN FLASH
========================================================= */

.flash {
    position: fixed;

    inset: 0;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #d68aff 20%,
            rgba(155, 45, 230, .7) 45%,
            transparent 75%
        );

    opacity: 0;

    pointer-events: none;

    z-index: 500;
}


.flash.active {
    animation: flashBang .45s ease-out forwards;
}


@keyframes flashBang {

    0% {
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    45% {
        opacity: .65;
    }

    100% {
        opacity: 0;
    }

}


/* =========================================================
   SCHOCKWELLE
========================================================= */

.shockwave {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 70px;
    height: 70px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    border: 4px solid #d281ff;

    opacity: 0;

    pointer-events: none;

    z-index: 60;
}


.shockwave.active {
    animation: shockwave 1s ease-out forwards;
}


@keyframes shockwave {

    0% {
        width: 70px;
        height: 70px;

        opacity: 1;

        box-shadow:
            0 0 50px #b642ff;
    }

    100% {
        width: 1200px;
        height: 1200px;

        opacity: 0;

        border-width: 1px;
    }

}


/* =========================================================
   KLEINE EXPLOSIONS-SPLITTER
========================================================= */

.debris {
    position: fixed;

    left: 50%;
    top: 50%;

    width: 13px;
    height: 35px;

    background:
        linear-gradient(
            135deg,
            #f0c6ff,
            #b744f4,
            #47105d
        );

    clip-path:
        polygon(
            50% 0,
            100% 38%,
            70% 100%,
            10% 78%,
            0 25%
        );

    pointer-events: none;

    z-index: 80;

    filter:
        drop-shadow(
            0 0 8px #bc55ff
        );

    animation:
        debrisExplosion
        var(--duration)
        cubic-bezier(.15,.7,.2,1)
        forwards;
}


@keyframes debrisExplosion {

    from {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            rotate(0)
            scale(1);
    }

    to {
        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            rotate(var(--rotation))
            scale(.15);
    }

}


/* =========================================================
   FRAGMENT MENÜ
========================================================= */

.fragment-menu {
    position: absolute;

    inset: 0;

    z-index: 40;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .5s ease;
}


.fragment-menu.visible {
    opacity: 1;
    visibility: visible;
}


/* JEDES FRAGMENT */

.fragment {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 190px;

    transform:
        translate(-50%, -50%)
        scale(.05);

    opacity: 0;

    cursor: pointer;

    border: none;

    background: none;

    padding: 0;

    z-index: 50;

    transition:
        filter .35s ease;

    will-change: transform;
}


.fragment img {
    display: block;

    width: 100%;

    pointer-events: none;

    user-select: none;

    filter:
        drop-shadow(
            0 0 13px
            rgba(175, 65, 245, .35)
        );
}


/* ==========================================
   ENDPOSITIONEN
========================================== */

.fragment.show {
    opacity: 1;
}


/* OBEN LINKS */

.fragment-story.show {
    animation:
        moveStory 1.15s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveStory {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05)
            rotate(0);
    }

    to {
        transform:
            translate(-430px, -300px)
            scale(1)
            rotate(-9deg);
    }

}


/* OBEN MITTE LINKS */

.fragment-members.show {
    animation:
        moveMembers 1.2s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveMembers {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(-220px, -340px)
            scale(.9)
            rotate(6deg);
    }

}


/* OBEN RECHTS */

.fragment-discord.show {
    animation:
        moveDiscord 1.25s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveDiscord {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(80px, -320px)
            scale(.9)
            rotate(-7deg);
    }

}


/* RECHTS OBEN */

.fragment-ranks.show {
    animation:
        moveRanks 1.2s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveRanks {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(290px, -220px)
            scale(.9)
            rotate(8deg);
    }

}


/* LINKS MITTE */

.fragment-color.show {
    animation:
        moveColor 1.15s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveColor {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(-480px, -20px)
            scale(.88)
            rotate(8deg);
    }

}


/* MITTE LINKS */

.fragment-outfit.show {
    animation:
        moveOutfit 1.25s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveOutfit {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(-220px, 5px)
            scale(.9)
            rotate(-5deg);
    }

}


/* MITTE RECHTS */

.fragment-hood.show {
    animation:
        moveHood 1.2s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveHood {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(80px, 15px)
            scale(.88)
            rotate(7deg);
    }

}


/* RECHTS MITTE */

.fragment-background.show {
    animation:
        moveBackground 1.3s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveBackground {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(310px, 80px)
            scale(.88)
            rotate(-7deg);
    }

}


/* UNTEN LINKS */

.fragment-values.show {
    width: 220px;

    animation:
        moveValues 1.3s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveValues {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(-320px, 260px)
            scale(.92)
            rotate(-4deg);
    }

}


/* UNTEN RECHTS */

.fragment-gallery.show {
    width: 210px;

    animation:
        moveGallery 1.35s
        cubic-bezier(.16,.85,.24,1.12)
        forwards;
}

@keyframes moveGallery {

    from {
        transform:
            translate(-50%, -50%)
            scale(.05);
    }

    to {
        transform:
            translate(100px, 275px)
            scale(.92)
            rotate(5deg);
    }

}


/* =========================================================
   FRAGMENT HOVER
========================================================= */

@media (hover: hover) {

    .fragment:hover {

        filter:
            brightness(1.22)
            drop-shadow(
                0 0 20px
                rgba(200, 95, 255, .85)
            )
            drop-shadow(
                0 0 60px
                rgba(135, 25, 220, .45)
            );

        z-index: 90;
    }

}


/* =========================================================
   INFO PANEL
========================================================= */

.content-screen {
    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;
    align-items: center;

    padding: 40px;

    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(100, 20, 150, .14),
            transparent 50%
        ),
        rgba(2, 2, 3, .96);

    backdrop-filter: blur(20px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    z-index: 300;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}


.content-screen.active {
    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


.content-box {
    position: relative;

    width: min(900px, 92vw);

    min-height: 480px;

    padding: 65px;

    border:
        1px solid
        rgba(179, 75, 245, .28);

    background:
        linear-gradient(
            145deg,
            rgba(18, 10, 23, .97),
            rgba(5, 5, 7, .97)
        );

    box-shadow:
        0 0 80px
        rgba(125, 30, 190, .1);

    transform:
        translateY(30px)
        scale(.97);

    transition:
        transform .5s
        cubic-bezier(.2,.8,.2,1);
}


.content-screen.active .content-box {
    transform:
        translateY(0)
        scale(1);
}


.content-label {
    color: #ab4be8;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: 6px;

    text-transform: uppercase;
}


.content-title {
    margin-top: 15px;

    font-size:
        clamp(45px, 6vw, 85px);

    letter-spacing: -4px;

    text-transform: uppercase;
}


.content-text {
    margin-top: 28px;

    max-width: 680px;

    color: #918a97;

    font-size: 16px;

    line-height: 1.9;
}


.back-button {
    margin-top: 42px;

    padding: 14px 28px;

    color: white;

    background: transparent;

    border:
        1px solid
        rgba(177, 65, 235, .55);

    font-size: 10px;

    letter-spacing: 4px;

    text-transform: uppercase;

    cursor: pointer;

    transition: .3s ease;
}


.back-button:hover {
    background: #9e39d9;

    border-color: #9e39d9;

    box-shadow:
        0 0 25px
        rgba(158, 57, 217, .4);
}


/* =========================================================
   RESET
========================================================= */

.reset-button {
    position: absolute;

    bottom: 30px;
    right: 40px;

    border: 0;

    background: none;

    color: #49434d;

    font-size: 9px;

    letter-spacing: 4px;

    cursor: pointer;

    opacity: 0;

    pointer-events: none;

    z-index: 100;

    transition: .3s;
}


.reset-button.visible {
    opacity: 1;

    pointer-events: auto;
}


.reset-button:hover {
    color: #a549dc;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 900px) {

    body {
        overflow-y: auto;
    }

    .page {
        min-height: 1100px;
    }

    .logo {
        top: 25px;
        left: 25px;

        font-size: 16px;

        letter-spacing: 5px;
    }

    .established {
        top: 29px;
        right: 25px;

        font-size: 7px;

        letter-spacing: 4px;
    }

    .amethyst-wrapper {
        width: min(360px, 75vw);
    }

    .fragment {
        width: 135px;
    }

    .fragment-values,
    .fragment-gallery {
        width: 150px;
    }

    @keyframes moveStory {
        to {
            transform:
                translate(-170px, -340px)
                scale(1)
                rotate(-7deg);
        }
    }

    @keyframes moveMembers {
        to {
            transform:
                translate(25px, -350px)
                scale(.9)
                rotate(5deg);
        }
    }

    @keyframes moveDiscord {
        to {
            transform:
                translate(-180px, -160px)
                scale(.9)
                rotate(-5deg);
        }
    }

    @keyframes moveRanks {
        to {
            transform:
                translate(30px, -165px)
                scale(.9)
                rotate(7deg);
        }
    }

    @keyframes moveColor {
        to {
            transform:
                translate(-180px, 20px)
                scale(.88)
                rotate(6deg);
        }
    }

    @keyframes moveOutfit {
        to {
            transform:
                translate(25px, 20px)
                scale(.9)
                rotate(-5deg);
        }
    }

    @keyframes moveHood {
        to {
            transform:
                translate(-180px, 200px)
                scale(.88)
                rotate(6deg);
        }
    }

    @keyframes moveBackground {
        to {
            transform:
                translate(25px, 205px)
                scale(.88)
                rotate(-5deg);
        }
    }

    @keyframes moveValues {
        to {
            transform:
                translate(-175px, 390px)
                scale(.9)
                rotate(-4deg);
        }
    }

    @keyframes moveGallery {
        to {
            transform:
                translate(20px, 400px)
                scale(.9)
                rotate(5deg);
        }
    }

    .content-box {
        padding: 35px;

        min-height: auto;
    }

}


</style>
</head>


<body>


<div class="page" id="page">


    <div class="background-glow"></div>


    <div class="logo">
        NO <span>MERCY</span>
    </div>


    <div class="established">
        EST. 2026
    </div>


    <!-- ================================
         START AMETHYST
    ================================= -->

    <div class="intro" id="intro">

        <div
            class="amethyst-wrapper"
            id="amethystButton"
            role="button"
            tabindex="0"
            aria-label="Amethyst öffnen"
        >

            <img
                src="amethyst.png"
                class="amethyst"
                id="amethyst"
                alt="No Mercy Amethyst"
            >

        </div>


        <div
            class="ground-light"
            id="groundLight"
        ></div>


        <div
            class="click-text"
            id="clickText"
        >
            CLICK THE AMETHYST
        </div>

    </div>



    <!-- ================================
         10 FRAGMENTE
    ================================= -->

    <div
        class="fragment-menu"
        id="fragmentMenu"
    >


        <button
            class="fragment fragment-story"
            data-section="story"
            type="button"
        >
            <img
                src="fragment-story.png"
                alt="Story"
            >
        </button>


        <button
            class="fragment fragment-members"
            data-section="members"
            type="button"
        >
            <img
                src="fragment-members.png"
                alt="Mitglieder"
            >
        </button>


        <button
            class="fragment fragment-discord"
            data-section="discord"
            type="button"
        >
            <img
                src="fragment-discord.png"
                alt="Discord"
            >
        </button>


        <button
            class="fragment fragment-ranks"
            data-section="ranks"
            type="button"
        >
            <img
                src="fragment-ranks.png"
                alt="Ränge"
            >
        </button>


        <button
            class="fragment fragment-color"
            data-section="color"
            type="button"
        >
            <img
                src="fragment-color.png"
                alt="Fraktionsfarbe"
            >
        </button>


        <button
            class="fragment fragment-outfit"
            data-section="outfit"
            type="button"
        >
            <img
                src="fragment-outfit.png"
                alt="Outfit"
            >
        </button>


        <button
            class="fragment fragment-hood"
            data-section="hood"
            type="button"
        >
            <img
                src="fragment-hood.png"
                alt="Hood"
            >
        </button>


        <button
            class="fragment fragment-background"
            data-section="background"
            type="button"
        >
            <img
                src="fragment-background.png"
                alt="Hintergrund"
            >
        </button>


        <button
            class="fragment fragment-values"
            data-section="values"
            type="button"
        >
            <img
                src="fragment-values.png"
                alt="Werte und Ziele"
            >
        </button>


        <button
            class="fragment fragment-gallery"
            data-section="gallery"
            type="button"
        >
            <img
                src="fragment-gallery.png"
                alt="Galerie"
            >
        </button>


    </div>


    <button
        class="reset-button"
        id="resetButton"
        type="button"
    >
        AMETHYST RESET
    </button>


</div>



<!-- FLASH -->

<div
    class="flash"
    id="flash"
></div>



<!-- SCHOCKWELLE -->

<div
    class="shockwave"
    id="shockwave"
></div>



<!-- ================================
     CONTENT
================================= -->

<div
    class="content-screen"
    id="contentScreen"
>

    <div class="content-box">

        <div
            class="content-label"
            id="contentLabel"
        >
            NO MERCY
        </div>


        <h1
            class="content-title"
            id="contentTitle"
        >
            STORY
        </h1>


        <p
            class="content-text"
            id="contentText"
        >
            Inhalt folgt.
        </p>


        <button
            class="back-button"
            id="backButton"
            type="button"
        >
            ← ZURÜCK
        </button>

    </div>

</div>



<script>


/* =========================================================
   ELEMENTE
========================================================= */

const page =
    document.getElementById("page");

const intro =
    document.getElementById("intro");

const amethystButton =
    document.getElementById("amethystButton");

const amethyst =
    document.getElementById("amethyst");

const clickText =
    document.getElementById("clickText");

const groundLight =
    document.getElementById("groundLight");

const flash =
    document.getElementById("flash");

const shockwave =
    document.getElementById("shockwave");

const fragmentMenu =
    document.getElementById("fragmentMenu");

const fragments =
    document.querySelectorAll(".fragment");

const contentScreen =
    document.getElementById("contentScreen");

const contentTitle =
    document.getElementById("contentTitle");

const contentLabel =
    document.getElementById("contentLabel");

const contentText =
    document.getElementById("contentText");

const backButton =
    document.getElementById("backButton");

const resetButton =
    document.getElementById("resetButton");


let hasBroken = false;


/* =========================================================
   INHALTE
========================================================= */

const sections = {

    story: {
        label: "THE BEGINNING",
        title: "GESCHICHTE",
        text:
            "Hier kommt später die vollständige Geschichte von No Mercy hin."
    },

    members: {
        label: "THE FAMILY",
        title: "MITGLIEDER",
        text:
            "Hier kommen mindestens 25 Mitglieder inklusive ihrer Discord-Namen hin."
    },

    discord: {
        label: "COMMUNICATION",
        title: "DISCORD",
        text:
            "Hier kommt der Einladungslink zu eurem Fraktions-Discord hin."
    },

    ranks: {
        label: "HIERARCHY",
        title: "RÄNGE",
        text:
            "Hier wird später die komplette Rangstruktur von No Mercy dargestellt."
    },

    color: {
        label: "IDENTITY",
        title: "FRAKTIONSFARBE",
        text:
            "Hier präsentieren wir eure Fraktionsfarbe und die dazugehörige Autofarbe."
    },

    outfit: {
        label: "APPEARANCE",
        title: "OUTFIT",
        text:
            "Hier kommen eure Fraktions-Outfits inklusive Bildern hinein."
    },

    hood: {
        label: "OUR TERRITORY",
        title: "ANWESEN / HOOD",
        text:
            "Hier präsentieren wir das gewünschte Anwesen beziehungsweise eure Hood."
    },

    background: {
        label: "THE FOUNDATION",
        title: "HINTERGRUND",
        text:
            "Hier erklären wir den Hintergrund, die Identität und die Idee hinter No Mercy."
    },

    values: {
        label: "OUR CODE",
        title: "WERTE & ZIELE",
        text:
            "Hier kommen eure Werte, Prinzipien und langfristigen Ziele hin."
    },

    gallery: {
        label: "MOMENTS",
        title: "GALERIE",
        text:
            "Hier entsteht später eine Galerie mit euren wichtigsten Bildern und Momenten."
    }

};


/* =========================================================
   HINTERGRUNDPARTIKEL
========================================================= */

function createParticle() {

    const particle =
        document.createElement("div");

    const size =
        1 + Math.random() * 3;

    particle.style.position =
        "absolute";

    particle.style.width =
        size + "px";

    particle.style.height =
        size + "px";

    particle.style.borderRadius =
        "50%";

    particle.style.background =
        "#b44cff";

    particle.style.boxShadow =
        "0 0 8px #b44cff";

    particle.style.opacity =
        Math.random() * .5;

    particle.style.left =
        Math.random() * 100 + "%";

    particle.style.top =
        Math.random() * 100 + "%";

    particle.style.pointerEvents =
        "none";

    particle.style.zIndex =
        "2";

    page.appendChild(particle);

}


for (
    let i = 0;
    i < 45;
    i++
) {

    createParticle();

}


/* =========================================================
   AMETHYST KLICK
========================================================= */

function breakAmethyst() {

    if (hasBroken) {
        return;
    }

    hasBroken = true;


    /*
       SCHRITT 1
       Energie aufladen
    */

    amethystButton.style.animation =
        "none";

    amethystButton.classList.add(
        "charging"
    );

    clickText.style.opacity =
        "0";


    /*
       SCHRITT 2
       Flash + Shockwave
    */

    setTimeout(() => {

        flash.classList.add(
            "active"
        );

        shockwave.classList.add(
            "active"
        );

    }, 600);


    /*
       SCHRITT 3
       Splitterexplosion
    */

    setTimeout(() => {

        createDebrisExplosion();

        amethyst.style.opacity =
            "0";

        amethyst.style.transform =
            "scale(.15)";

        groundLight.style.opacity =
            ".15";

    }, 670);


    /*
       SCHRITT 4
       Intro verschwindet
    */

    setTimeout(() => {

        intro.style.opacity =
            "0";

        intro.style.transform =
            "scale(.85)";

    }, 820);


    /*
       SCHRITT 5
       Fragment-Menü
    */

    setTimeout(() => {

        intro.style.display =
            "none";

        fragmentMenu.classList.add(
            "visible"
        );


        fragments.forEach(
            (fragment, index) => {

                setTimeout(() => {

                    fragment.classList.add(
                        "show"
                    );

                }, index * 65);

            }
        );


        resetButton.classList.add(
            "visible"
        );

    }, 1050);

}



/* KLICK */

amethystButton.addEventListener(
    "click",
    breakAmethyst
);


/* ENTER / SPACE */

amethystButton.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {

            event.preventDefault();

            breakAmethyst();

        }

    }
);


/* =========================================================
   EXPLOSIONS-SPLITTER
========================================================= */

function createDebrisExplosion() {

    const amount = 70;


    for (
        let i = 0;
        i < amount;
        i++
    ) {

        const debris =
            document.createElement(
                "div"
            );


        debris.className =
            "debris";


        const angle =
            Math.random()
            * Math.PI
            * 2;


        const distance =
            150
            + Math.random()
            * 600;


        const x =
            Math.cos(angle)
            * distance;


        const y =
            Math.sin(angle)
            * distance;


        const rotation =
            (
                Math.random()
                * 1600
            )
            - 800;


        const duration =
            .7
            + Math.random()
            * .7;


        const size =
            5
            + Math.random()
            * 17;


        debris.style.width =
            size + "px";

        debris.style.height =
            (
                size
                * (
                    1.4
                    + Math.random()
                )
            )
            + "px";


        debris.style.setProperty(
            "--x",
            x + "px"
        );

        debris.style.setProperty(
            "--y",
            y + "px"
        );

        debris.style.setProperty(
            "--rotation",
            rotation + "deg"
        );

        debris.style.setProperty(
            "--duration",
            duration + "s"
        );


        document.body.appendChild(
            debris
        );


        setTimeout(() => {

            debris.remove();

        }, 1600);

    }

}


/* =========================================================
   FRAGMENT KLICK
========================================================= */

fragments.forEach(fragment => {

    fragment.addEventListener(
        "click",
        () => {

            const sectionName =
                fragment.dataset.section;

            const section =
                sections[sectionName];


            if (!section) {
                return;
            }


            contentLabel.textContent =
                section.label;

            contentTitle.textContent =
                section.title;

            contentText.textContent =
                section.text;


            contentScreen.classList.add(
                "active"
            );

        }
    );

});


/* =========================================================
   ZURÜCK
========================================================= */

backButton.addEventListener(
    "click",
    () => {

        contentScreen.classList.remove(
            "active"
        );

    }
);


/*
   ESC funktioniert ebenfalls
*/

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            contentScreen.classList.remove(
                "active"
            );

        }

    }
);


/* =========================================================
   RESET
========================================================= */

resetButton.addEventListener(
    "click",
    () => {

        location.reload();

    }
);


</script>
